<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soluciones Argentinas SRL</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Selector de idioma -->
  <div class="lang-switch">
    <div class="lang-toggle">
      <div class="toggle-indicator"></div>

      <button id="btn-es" class="lang-option active" data-lang="es">
        ESP
      </button>

      <button id="btn-en" class="lang-option" data-lang="en">
        ENG
      </button>
    </div>
  </div>

  <!-- Imagen de fondo -->
  <img id="imgFondo" class="fondo" src="img/fondo-texto.jpg" alt="Fondo" />

  <!-- Texto overlay -->
  <div id="overlayText" class="overlay-text">Sitio en construcción</div>

<script>
/* --- Detectar mobile --- */
function isMobile() {
  return window.innerWidth <= 768;
}

/* --- Cargar imagen inicial --- */
function setInitialImage() {
  const fondo = document.getElementById("imgFondo");
  fondo.src = isMobile() ? "img/fondo-vertical.png" : "img/fondo-texto.jpg";
}

/* --- Cambiar idioma / texto / imagen --- */
function setLanguage(lang) {
  const overlay = document.getElementById("overlayText");
  const fondo = document.getElementById("imgFondo");

  overlay.style.opacity = 0;
  fondo.style.opacity = 0;

  setTimeout(() => {
    const mobile = isMobile();

    if (lang === "es") {
      overlay.textContent = "Sitio en construcción";
      fondo.src = mobile ? "img/fondo-vertical.png" : "img/fondo-texto.jpg";
    } else {
      overlay.textContent = "Coming soon";
      fondo.src = mobile ? "img/fondo-ingles-vertical.png" : "img/fondo-ingles.jpg";
    }

    overlay.style.animation = "none";
    void overlay.offsetWidth;
    overlay.style.animation = "";

    overlay.style.opacity = 1;
    fondo.style.opacity = 1;
  }, 200);
}

/* --- Toggle de botones --- */
const btnEs = document.getElementById("btn-es");
const btnEn = document.getElementById("btn-en");
const indicator = document.querySelector(".toggle-indicator");

/* 
   ⭐ Versión definitiva pixel-perfect
   Alínea el indicador exactamente debajo del botón ENG 
*/
function switchLang(lang) {
  const toggle = document.querySelector(".lang-toggle");

  // Rectángulos absolutos del contenedor y botón ENG
  const toggleRect = toggle.getBoundingClientRect();
  const engRect = btnEn.getBoundingClientRect();

  // Distancia exacta hacia el botón ENG
  const moveToEng = engRect.left - toggleRect.left;

  if (lang === "es") {
    btnEs.classList.add("active");
    btnEn.classList.remove("active");

    indicator.style.transform = `translateX(0px)`;
    setLanguage("es");

  } else {
    btnEs.classList.remove("active");
    btnEn.classList.add("active");

    indicator.style.transform = `translateX(${moveToEng}px)`;
    setLanguage("en");
  }
}

btnEs.addEventListener("click", () => switchLang("es"));
btnEn.addEventListener("click", () => switchLang("en"));

/* --- Cambio de imagen al redimensionar --- */
window.onload = setInitialImage;

window.onresize = () => {
  const fondo = document.getElementById("imgFondo");
  const isEng = document.getElementById("overlayText").textContent === "Coming soon";

  fondo.src = isEng
    ? (isMobile() ? "img/fondo-ingles-vertical.png" : "img/fondo-ingles.jpg")
    : (isMobile() ? "img/fondo-vertical.png" : "img/fondo-texto.jpg");
};
</script>

</body>
</html>
